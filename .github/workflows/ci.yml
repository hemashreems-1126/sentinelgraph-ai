name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinelgraph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      USE_MOCK_LLM: "true"
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://sentinel:ci-only-password@localhost:5432/sentinelgraph_test' || 'sqlite:///./ci.db' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly
        run: python -c "from app.db.session import init_db; init_db(); init_db(); print('migrations ok')"
      - name: Test suite
        run: python -m pytest tests -q

  evaluation:
    name: Evaluation smoke run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      USE_MOCK_LLM: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python run_eval.py --customers 300 --transactions 4000 --cases 60 --out ci_eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: backend/ci_eval.json

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
