services:
  # Backend Web Service
  - type: web
    name: sentinelgraph-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./sentinelgraph.db
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: USE_MOCK_LLM
        value: "false"

  # Frontend Static Site
  - type: web
    name: sentinelgraph-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sentinelgraph-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
