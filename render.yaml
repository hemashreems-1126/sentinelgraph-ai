databases:
  - name: sentinelgraph-db
    databaseName: sentinelgraph_db
    user: sentinel
    plan: free
    region: oregon

services:
  # Backend Web Service
  - type: web
    name: sentinelgraph-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelgraph-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false # Set via Render Dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: USE_MOCK_LLM
        value: "false"

  # Frontend Web Service
  - type: web
    name: sentinelgraph-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sentinelgraph-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
